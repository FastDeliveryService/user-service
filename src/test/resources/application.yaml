spring:
  application:
    name: fds-security-starter
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8080/realms/dummy}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yml

keycloak:
  url: ${KEYCLOAK_URL:placeholder}
  client-realm: ${KEYCLOAK_CLIENT_REALM:fast-delivery-service}
  client-id: ${KEYCLOAK_CLIENT_ID:fdsUserService}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:placeholder}