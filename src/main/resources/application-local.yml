spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:1337/realms/fast-delivery-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/user_db
    username: fds_user
    password: fds_password
    driver-class-name: org.postgresql.Driver

  web:
    error:
      include-message: always
      include-binding-errors: always

logging:
  level:
    # Set the logging level for all Spring Security components
    org.springframework.security: DEBUG

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:1337}
