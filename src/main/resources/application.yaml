spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yml

server:
  port: 8080

keycloak:
  url: ${KEYCLOAK_URL}
  client-realm: ${KEYCLOAK_CLIENT_REALM:fast-delivery-service}
  client-id: ${KEYCLOAK_CLIENT_ID:fdsUserService}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}